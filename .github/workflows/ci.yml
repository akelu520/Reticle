name: CI

permissions:
  # Publishing a GitHub Release needs write access to repository contents.
  contents: write

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Unit tests (ReticleCore)
        run: swift test --package-path Packages/ReticleCore
      - name: Build and package
        run: scripts/build-dmg.sh
      - name: Report size
        run: du -sh build/dd/Build/Products/Release/Reticle.app build/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Reticle-dmg
          path: build/*.dmg
      - name: Release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Only the DMG whose version matches the tag, never another version's build.
          files: build/Reticle-${{ env.VERSION }}.dmg
          body_path: docs/releases/${{ github.ref_name }}.md
