name: Reticle
options:
  bundleIdPrefix: io.github.akelu520
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ReticleCore:
    path: Packages/ReticleCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  ReticleWorker:
    type: tool
    platform: macOS
    sources:
      - path: Worker
      - path: Shared
    dependencies:
      - package: ReticleCore
    settings:
      base:
        PRODUCT_NAME: ReticleWorker
        PRODUCT_BUNDLE_IDENTIFIER: io.github.akelu520.reticle.worker
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        DEAD_CODE_STRIPPING: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize
          STRIP_INSTALLED_PRODUCT: YES
          DEPLOYMENT_POSTPROCESSING: YES
  Reticle:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: ReticleCore
      # Memory-heavy tasks (OCR, recording) run in this helper, copied to Contents/MacOS.
      - target: ReticleWorker
        embed: true
        copy:
          destination: executables
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Reticle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Reticle"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.akelu520.reticle
        PRODUCT_NAME: Reticle
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        DEAD_CODE_STRIPPING: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize
          STRIP_INSTALLED_PRODUCT: YES
          DEPLOYMENT_POSTPROCESSING: YES
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
schemes:
  Reticle:
    build:
      targets:
        Reticle: all
    run:
      config: Debug
    archive:
      config: Release
